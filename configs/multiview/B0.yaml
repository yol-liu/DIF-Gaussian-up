model:
  image_encoder:
    out_ch: 128
  point_decoder:
    mlp_chs: [256, 64, 16, 1]
    legacy_head: false
  mask_fov: true
  anchor_fusion: max
  point_fusion: max
  gs:
    t: 512
    res: 12
    p_dist_scaling: 1.0
    o_scaling: 1.0
    s_scaling: 0.3
    knn_k: 3
    shifted_center_knn: false
    normalize_weights: false
    covariance_jitter: 0.0
  latent:
    use_latent: false
dataset:
  root_dir: /home/user/workspace/C2RV-CBCT/data
  gs_res: 12
  structure_supervision: false
loss:
  reconstruction_loss: mse
ray_consistency:
  enabled: false
transfer:
  enabled: false
