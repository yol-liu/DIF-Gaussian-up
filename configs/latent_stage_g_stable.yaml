# Stage G: global-only latent on TOP of the stable deterministic GA recipe.
# Prerequisites: Stage A (base) and Stage B (stable GA) should already look healthy.
# Do NOT stack aggressive GS / view_dropout here — those belong to later stages.
model:
  image_encoder:
    out_ch: 128
  point_decoder:
    mlp_chs: [256, 64, 16, 1]

  anchor_fusion: geometry_attention
  point_fusion: max

  view_fusion:
    d_model: 256
    num_heads: 4
    num_layers: 1
    dropout: 0.0
    geometry_hidden_dim: 64
    return_attention: false
    view_dropout: 0.0
    min_train_views: 2
    use_max_residual: true
    content_query: true

  gs:
    t: 512
    res: 12
    p_dist_scaling: 1.0
    o_scaling: 1.0
    s_scaling: 0.3
    knn_k: 3
    shifted_center_knn: false
    normalize_weights: false
    covariance_jitter: 0.0

  latent:
    use_latent: true
    global_dim: 64
    use_local: false          # Stage L later; keep false for Stage G
    local_dim: 16
    grid_res: 4
    beta_g: 1.0e-3
    beta_l: 1.0e-2
    free_bits_g: 0.5
    free_bits_l: 0.1
    kl_warmup_steps: 20000
    prior_sigma_floor: 1.0e-2
    volume_likelihood: laplace
    volume_sigma: 0.1
    lambda_v: 1.0
    gt_feat_ch: 32
  sampling:
    sample_from: posterior
    num_samples: 1

dataset:
  root_dir: /home/user/workspace/C2RV-CBCT/data
  gs_res: 12
