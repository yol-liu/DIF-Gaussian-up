# Dense NP with Gaussian NLL likelihood (sigma 0.1) and beta 1e-3 (the original repair recipe).
# Generated by scripts/build_experiment_plan.py; edit the generator, not this file.
model:
  image_encoder:
    out_ch: 128
  point_decoder:
    mlp_chs:
    - 256
    - 64
    - 16
    - 1
    legacy_head: false
  mask_fov: true
  anchor_fusion: geometry_transformer
  point_fusion: max
  multiview_transformer:
    d_model: 128
    num_heads: 4
    num_blocks: 2
    feature_scales:
    - 4
    - 8
    - 16
    samples_per_scale: 5
    spatial_window: 3
    dropout: 0.0
    anchor_chunk_size: 256
    point_chunk_size: 8192
    residual_init: 0.001
    residual_base: false
    token_init: mean
    fixed_radius_pixels: 1.0
    footprint_min_pixels: 0.25
    footprint_max_pixels: 2.0
    anatomy:
      enabled: false
      guided_sampling: false
      length_mm: 8.0
      kappa: 4.0
      sigma_floor_mm: 0.25
      warmup_steps: 100
      loss_weight: 0.01
  gs:
    t: 512
    res: 12
    p_dist_scaling: 1.0
    o_scaling: 1.0
    s_scaling: 0.3
    knn_k: 3
    shifted_center_knn: false
    normalize_weights: false
    covariance_jitter: 0.0
  probabilistic:
    mode: dense_np
    objective: joint
    normalization: groupnorm_anchor_instance
    film_init_std: 0.001
    train_samples: 1
    latent:
      global_dim: 64
      use_local: false
      sigma_min: 0.001
      sigma_max: 3.0
      initial_sigma: 0.5
    reconstruction:
      likelihood: gaussian
      observation_sigma: 0.1
      reduction: mean_query
    kl:
      beta_final: 0.001
      warmup_steps: 500
      free_bits: 0.0
      free_bits_order: per_case
      reduction: sum_latent_mean_batch
    evaluation:
      estimator: prior_mc_mean
      num_samples: 8
      seed: 0
dataset:
  root_dir: /media/wyin/Expansion/Data/LUNA16/C2RV-CBCT/data
  gs_res: 12
  structure_supervision: false
  paired_views:
    dense_count: 12
    context_counts:
    - 6
loss:
  reconstruction_loss: gaussian
  volume_sigma: 0.1
ray_consistency:
  enabled: false
transfer:
  enabled: false
