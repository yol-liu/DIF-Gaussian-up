# Older late cross-view attention on anchors instead of the geometry transformer.
# Generated by scripts/build_experiment_plan.py; edit the generator, not this file.
model:
  image_encoder:
    out_ch: 128
  point_decoder:
    mlp_chs:
    - 256
    - 64
    - 16
    - 1
    legacy_head: false
  mask_fov: true
  anchor_fusion: geometry_attention
  point_fusion: max
  gs:
    t: 512
    res: 12
    p_dist_scaling: 1.0
    o_scaling: 1.0
    s_scaling: 0.3
    knn_k: 3
    shifted_center_knn: false
    normalize_weights: false
    covariance_jitter: 0.0
  latent:
    use_latent: false
  view_fusion:
    d_model: 128
    num_heads: 4
    num_layers: 2
    dropout: 0.0
    geometry_hidden_dim: 32
    return_attention: false
    view_dropout: 0.0
    min_train_views: 1
    use_max_residual: true
    content_query: true
dataset:
  root_dir: /home/user/workspace/C2RV-CBCT/data
  gs_res: 12
  structure_supervision: false
loss:
  reconstruction_loss: mse
ray_consistency:
  enabled: false
transfer:
  enabled: false
