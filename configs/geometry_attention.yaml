model:
  image_encoder:
    out_ch: 128
  point_decoder:
    mlp_chs: [256, 64, 16, 1]

  # multi-view fusion:
  # - anchor_fusion: 'max' (legacy) or 'geometry_attention'
  # - point_fusion: 'max' only (dense query points keep max pooling in this milestone)
  #
  # NOTE: Prefer configs/geometry_attention_stable.yaml for training.
  # This file keeps the original aggressive settings for ablation.
  anchor_fusion: geometry_attention
  point_fusion: max

  view_fusion:
    d_model: 128
    num_heads: 4
    num_layers: 2
    dropout: 0.1
    geometry_hidden_dim: 32
    return_attention: false
    view_dropout: 0.2    # training-time view dropout probability (0 disables)
    min_train_views: 2   # minimum number of views kept per batch item
    use_max_residual: false  # true in stable config
    content_query: false     # true in stable config

  gs:
    t: 512  # temperature (a scaling factor)
    res: 12 # the resolution of GS points
    p_dist_scaling: 1.0
    o_scaling: 1.0 # for offsets
    s_scaling: 0.3 # for scaling vector
    knn_k: 8                  # legacy: 3
    shifted_center_knn: true  # legacy: false (KNN on unshifted anchors)
    normalize_weights: true   # legacy: false (unnormalized density summation)
    covariance_jitter: 1.0e-6 # legacy: 0.0

dataset:
  # CBCT_dataset joins root_dir / dst_name (default: LUNA16)
  # Expected layout: <root_dir>/LUNA16/{meta_info.json,config.yaml,processed/...}
  root_dir: /media/wyin/Expansion/Data/LUNA16/C2RV-CBCT/data
  gs_res: 12 # the resolution of GS points (12^3 points in total)
