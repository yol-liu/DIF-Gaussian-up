<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180" font-family="Arial, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrBlue"  markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2E6FB7"/></marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2E8B57"/></marker>
    <marker id="arrRed"   markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#C0392B"/></marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#E0891B"/></marker>
    <marker id="arrPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7D3C98"/></marker>
    <marker id="arrGray"  markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7F8C8D"/></marker>
  </defs>

  <text x="750" y="36" text-anchor="middle" font-size="26" font-weight="bold" fill="#1A2733">GT-CVAE 后验引导概率建模 — geometry_transformer 条件编码（gt_cvae）</text>

  <!-- ================= band C ================= -->
  <rect x="50" y="60" width="1400" height="190" rx="10" fill="#EAF3FC" stroke="#2E6FB7" stroke-width="1.5"/>
  <text x="66" y="84" font-size="12.5" font-weight="bold" fill="#2E6FB7">① 条件编码 C（稀疏 6 视图 → 共享条件 trunk）</text>

  <g stroke="#2E6FB7" fill="#ffffff">
    <rect x="70" y="100" width="190" height="90" rx="8"/>
    <rect x="300" y="100" width="210" height="90" rx="8"/>
    <rect x="550" y="100" width="250" height="90" rx="8"/>
    <rect x="840" y="100" width="230" height="90" rx="8"/>
    <rect x="1180" y="100" width="250" height="110" rx="8"/>
  </g>
  <text x="165" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A2733">6视图投影</text>
  <text x="165" y="152" text-anchor="middle" font-size="12" fill="#34495E">projs [B,6,1,256,256]</text>
  <text x="165" y="170" text-anchor="middle" font-size="11.5" fill="#7F8C8D">（唯一观测，无 GT）</text>

  <text x="405" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A2733">UNet 特征提取（E1）</text>
  <text x="405" y="152" text-anchor="middle" font-size="12" fill="#34495E">pyramid {4:256, 8:512, 16:1024}</text>
  <text x="405" y="170" text-anchor="middle" font-size="11.5" fill="#7F8C8D">feats_ds [B,6,1024,16,16]</text>

  <text x="675" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A2733">geometry_transformer（E2）</text>
  <text x="675" y="152" text-anchor="middle" font-size="12" fill="#34495E">2×GeometryBlock · 1728 锚点</text>
  <text x="675" y="170" text-anchor="middle" font-size="11.5" fill="#7F8C8D">cross-attn(90 obs) + 3D local + FFN</text>

  <text x="955" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A2733">anchor_feats</text>
  <text x="955" y="152" text-anchor="middle" font-size="12" fill="#34495E">[B,1024,1728]</text>
  <text x="955" y="170" text-anchor="middle" font-size="11.5" fill="#7F8C8D">条件特征（高斯MLP / 分布头共享）</text>

  <text x="1305" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A2733">pooled = 条件 C</text>
  <text x="1305" y="152" text-anchor="middle" font-size="12" fill="#34495E">[B,1031]</text>
  <text x="1305" y="172" text-anchor="middle" font-size="11.5" fill="#34495E">= anchor_feats.mean(-1)</text>
  <text x="1305" y="190" text-anchor="middle" font-size="11.5" fill="#8E44AD">⊕ observation_descriptor(7维视角几何)</text>

  <line x1="260" y1="145" x2="295" y2="145" stroke="#2E6FB7" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="510" y1="145" x2="545" y2="145" stroke="#2E6FB7" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="800" y1="145" x2="835" y2="145" stroke="#2E6FB7" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="1070" y1="145" x2="1175" y2="145" stroke="#2E6FB7" stroke-width="2" marker-end="url(#arrBlue)"/>
  <!-- pooled -> prior -->
  <path d="M 1210,210 L 1210,265 L 300,265 L 300,295" fill="none" stroke="#2E6FB7" stroke-width="2" marker-end="url(#arrBlue)"/>
  <!-- pooled -> posterior -->
  <path d="M 1300,210 L 1300,278 L 1135,278 L 1135,295" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#arrRed)"/>

  <!-- ================= band distributions ================= -->
  <g stroke="#2E8B57" fill="#E9F6EE">
    <rect x="100" y="300" width="400" height="170" rx="10"/>
  </g>
  <text x="116" y="324" font-size="13" font-weight="bold" fill="#2E8B57">prior　p(z|C)　（部署分布）</text>
  <rect x="120" y="344" width="360" height="48" rx="6" fill="#ffffff" stroke="#2E8B57"/>
  <text x="300" y="364" text-anchor="middle" font-size="12" fill="#1A2733">prior_head : BoundedGaussianHead(1031 → 64)</text>
  <text x="300" y="381" text-anchor="middle" font-size="11.5" fill="#7F8C8D">Linear(1031→128)→SiLU→Linear(128→128)</text>
  <rect x="120" y="404" width="360" height="52" rx="6" fill="#ffffff" stroke="#2E8B57"/>
  <text x="300" y="424" text-anchor="middle" font-size="12" fill="#1A2733">输出：μ_p, σ_p [B,64]</text>
  <text x="300" y="441" text-anchor="middle" font-size="11.5" fill="#7F8C8D">仅凭稀疏观测，不接触任何 GT</text>

  <g stroke="#C0392B" fill="#FDEEEE">
    <rect x="900" y="300" width="470" height="170" rx="10"/>
  </g>
  <text x="916" y="324" font-size="13" font-weight="bold" fill="#C0392B">posterior　q(z|C,Y)　（GT 后验引导，仅训练）</text>
  <rect x="920" y="344" width="430" height="48" rx="6" fill="#ffffff" stroke="#C0392B"/>
  <text x="1135" y="364" text-anchor="middle" font-size="12" fill="#1A2733">posterior_head : BoundedGaussianHead(1031+32 → 64)</text>
  <text x="1135" y="381" text-anchor="middle" font-size="11.5" fill="#7F8C8D">输入 = pooled ⊕ gt_global_feat</text>
  <rect x="920" y="404" width="430" height="52" rx="6" fill="#ffffff" stroke="#C0392B"/>
  <text x="1135" y="424" text-anchor="middle" font-size="12" fill="#1A2733">输出：μ_q, σ_q [B,64]</text>
  <text x="1135" y="441" text-anchor="middle" font-size="11.5" fill="#7F8C8D">z 被真值“引导”编码该例的解</text>

  <rect x="620" y="312" width="250" height="50" rx="6" fill="#ffffff" stroke="#C0392B"/>
  <text x="745" y="333" text-anchor="middle" font-size="12" fill="#1A2733">GT volume Y [B,1,256³]</text>
  <text x="745" y="350" text-anchor="middle" font-size="11.5" fill="#C0392B">（真值 CT，测试时不存在）</text>
  <rect x="620" y="378" width="250" height="50" rx="6" fill="#ffffff" stroke="#C0392B"/>
  <text x="745" y="399" text-anchor="middle" font-size="12" fill="#1A2733">GTEncoder：Conv3d×2 → 8ch</text>
  <text x="745" y="416" text-anchor="middle" font-size="11.5" fill="#34495E">gt_global_feat [B,32]</text>
  <line x1="745" y1="362" x2="745" y2="373" stroke="#C0392B" stroke-width="2" marker-end="url(#arrRed)"/>
  <line x1="870" y1="403" x2="895" y2="403" stroke="#C0392B" stroke-width="2" marker-end="url(#arrRed)"/>

  <!-- KL -->
  <line x1="505" y1="385" x2="890" y2="385" stroke="#8E44AD" stroke-width="2"
        marker-start="none" marker-end="none"/>
  <line x1="505" y1="378" x2="890" y2="378" stroke="#2E8B57" stroke-width="2" marker-start="none" marker-end="none"/>
  <text x="700" y="340" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#B26A00">β(t)·Σ_d max( KL_d , 0.05 )　free_bits 逐维下限</text>
  <text x="700" y="360" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8E44AD">KL = D_KL[ q(z|C,Y) ‖ p(z|C) ]</text>
  <text x="210" y="385" font-size="11" fill="#2E8B57">q → p 对齐</text>

  <!-- ================= band z ================= -->
  <g stroke="#E0891B" fill="#FFF4E0">
    <rect x="600" y="590" width="300" height="70" rx="10"/>
  </g>
  <text x="750" y="618" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#B26A00">z [B,64]　全局潜变量</text>
  <text x="750" y="642" text-anchor="middle" font-size="11.5" fill="#7F8C8D">多假设建模：每种 z 对应一种重建</text>

  <path d="M 1135,470 L 1135,540 L 750,540 L 750,585" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#arrRed)"/>
  <path d="M 300,470 L 300,528 L 620,528 L 620,585" fill="none" stroke="#2E8B57" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrGreen)"/>
  <text x="1100" y="515" font-size="11.5" fill="#C0392B">训练 reparameterize（q 采样）</text>
  <text x="255" y="505" font-size="11.5" fill="#2E8B57">部署　z ~ p(z|C)　×8</text>

  <text x="130" y="640" font-size="12.5" font-weight="bold" fill="#1A2733">③ z 双通道注入</text>

  <g stroke="#E0891B" fill="#FFF4E0">
    <rect x="430" y="660" width="320" height="90" rx="8"/>
    <rect x="750" y="660" width="320" height="90" rx="8"/>
  </g>
  <text x="590" y="686" text-anchor="middle" font-size="13" font-weight="bold" fill="#B26A00">FiLM 注入（锚点通路）</text>
  <text x="590" y="706" text-anchor="middle" font-size="11.5" fill="#34495E">gs_feats′ = (1+γ(z))⊙f + β(z)</text>
  <text x="590" y="723" text-anchor="middle" font-size="11.5" fill="#7F8C8D">γ/β 由 z 经 MLP 生成（零初始化）</text>
  <text x="590" y="740" text-anchor="middle" font-size="11" fill="#B26A00">调制高斯插值特征 [B,128,1728]</text>

  <text x="910" y="686" text-anchor="middle" font-size="13" font-weight="bold" fill="#B26A00">z_point_proj（像素通路, ft_z）</text>
  <text x="910" y="706" text-anchor="middle" font-size="11.5" fill="#34495E">零初始化 Linear(64→128)</text>
  <text x="910" y="723" text-anchor="middle" font-size="11.5" fill="#7F8C8D">p_feats += z_proj</text>
  <text x="910" y="740" text-anchor="middle" font-size="11" fill="#B26A00">直入逐点像素证据通路</text>

  <line x1="640" y1="640" x2="560" y2="655" stroke="#E0891B" stroke-width="2" marker-end="url(#arrOrange)"/>
  <line x1="860" y1="640" x2="900" y2="655" stroke="#E0891B" stroke-width="2" marker-end="url(#arrOrange)"/>

  <!-- ================= band decode ================= -->
  <g stroke="#7D3C98" fill="#F4ECFA">
    <rect x="300" y="820" width="320" height="90" rx="8"/>
    <rect x="720" y="820" width="340" height="90" rx="8"/>
    <rect x="1100" y="810" width="350" height="110" rx="10"/>
  </g>
  <text x="460" y="846" text-anchor="middle" font-size="13" font-weight="bold" fill="#7D3C98">② 高斯插值 query_gs</text>
  <text x="460" y="866" text-anchor="middle" font-size="11.5" fill="#34495E">knn_k=3 · 密度权重（Σ 由 s,r 构建）</text>
  <text x="460" y="883" text-anchor="middle" font-size="11.5" fill="#7F8C8D">体素插值特征 [B,128,N]</text>
  <text x="460" y="897" text-anchor="middle" font-size="10.5" fill="#B26A00">← 被 FiLM 调制后的 gs_feats 加权</text>

  <text x="890" y="846" text-anchor="middle" font-size="13" font-weight="bold" fill="#7D3C98">④ 逐点解码 point_decoder</text>
  <text x="890" y="866" text-anchor="middle" font-size="11.5" fill="#34495E">concat [p_feats ⊕ interp_feats]</text>
  <text x="890" y="883" text-anchor="middle" font-size="11.5" fill="#7F8C8D">4×Conv1d：256→256→64→16→1</text>
  <text x="890" y="897" text-anchor="middle" font-size="10.5" fill="#B26A00">← p_feats 已含 z_point_proj 注入</text>

  <text x="1275" y="834" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7D3C98">重建体积 ŷ [B,1,256³]</text>
  <text x="1275" y="856" text-anchor="middle" font-size="11.5" fill="#34495E">训练：NLL(ŷ, Y)（高斯似然 σ=0.1，mean 查询）</text>
  <text x="1275" y="874" text-anchor="middle" font-size="11.5" fill="#34495E">部署：8 次 z 采样 → 8 个重建</text>
  <text x="1275" y="892" text-anchor="middle" font-size="11.5" fill="#7D3C98">mean → 预测 · 样本方差 → 逐点不确定性</text>

  <line x1="590" y1="750" x2="480" y2="815" stroke="#E0891B" stroke-width="2" marker-end="url(#arrOrange)"/>
  <line x1="900" y1="750" x2="890" y2="815" stroke="#E0891B" stroke-width="2" marker-end="url(#arrOrange)"/>
  <line x1="620" y1="865" x2="715" y2="865" stroke="#7D3C98" stroke-width="2" marker-end="url(#arrPurple)"/>
  <line x1="1060" y1="865" x2="1095" y2="865" stroke="#7D3C98" stroke-width="2" marker-end="url(#arrPurple)"/>

  <!-- ================= loss / deploy ================= -->
  <g stroke="#34495E" fill="#F0F4F8">
    <rect x="80" y="1000" width="640" height="125" rx="10"/>
  </g>
  <text x="100" y="1024" font-size="13" font-weight="bold" fill="#34495E">训练损失（joint objective）</text>
  <text x="100" y="1048" font-size="12" fill="#1A2733">L = NLL(ŷ_q, Y)　　　　　　　← 后验采样重建</text>
  <text x="100" y="1070" font-size="12" fill="#1A2733">　　+ β(t)·Σ max(KL_d, 0.05)　← KL 项（free_bits）</text>
  <text x="100" y="1092" font-size="12" fill="#1A2733">　　+ 0.2·NLL(ŷ_prior, Y)　　　← 先验直通（部署分支）</text>
  <text x="100" y="1112" font-size="11" fill="#7F8C8D">β：0 → 0.02（warmup 500 步）；KL 逐维下限 0.05 nats</text>

  <g stroke="#2E8B57" fill="#EEF7EE">
    <rect x="780" y="1000" width="640" height="125" rx="10"/>
  </g>
  <text x="800" y="1024" font-size="13" font-weight="bold" fill="#2E8B57">部署推理（无 GT）— prior_mc_mean S8</text>
  <text x="800" y="1048" font-size="12" fill="#1A2733">z₁..z₈ ~ p(z|C) → 8 次重建 ŷ₁..ŷ₈</text>
  <text x="800" y="1070" font-size="12" fill="#1A2733">predict = mean(ŷ)　（逐体素均值）</text>
  <text x="800" y="1092" font-size="12" fill="#1A2733">predictive_var = 样本方差（逐体素不确定性）</text>
  <text x="800" y="1112" font-size="11" fill="#7F8C8D">后验（GT 引导）训练后退场，仅诊断时 oracle=True 启用</text>

  <path d="M 1160,810 L 1160,962 L 724,962 L 724,995" fill="none" stroke="#7F8C8D" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrGray)"/>
  <text x="1180" y="930" font-size="11" fill="#7F8C8D">训练</text>
  <path d="M 1260,810 L 1260,950 L 1100,950 L 1100,995" fill="none" stroke="#7F8C8D" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrGray)"/>
  <text x="1280" y="900" font-size="11" fill="#7F8C8D">部署</text>

  <!-- ================= legend ================= -->
  <rect x="50" y="1140" width="1400" height="30" rx="8" fill="#F8FAFC" stroke="#D5DBE0"/>
  <rect x="70" y="1148" width="16" height="14" fill="#EAF3FC" stroke="#2E6FB7"/>
  <text x="92" y="1160" font-size="11.5" fill="#1A2733">条件编码 C（共享 trunk）</text>
  <rect x="300" y="1148" width="16" height="14" fill="#E9F6EE" stroke="#2E8B57"/>
  <text x="322" y="1160" font-size="11.5" fill="#1A2733">prior（部署分布）</text>
  <rect x="520" y="1148" width="16" height="14" fill="#FDEEEE" stroke="#C0392B"/>
  <text x="542" y="1160" font-size="11.5" fill="#1A2733">GT 后验（训练引导）</text>
  <rect x="740" y="1148" width="16" height="14" fill="#FFF4E0" stroke="#E0891B"/>
  <text x="762" y="1160" font-size="11.5" fill="#1A2733">z 注入（FiLM / z_point_proj）</text>
  <rect x="1000" y="1148" width="16" height="14" fill="#F4ECFA" stroke="#7D3C98"/>
  <text x="1022" y="1160" font-size="11.5" fill="#1A2733">解码重建</text>
  <line x1="1180" y1="1155" x2="1210" y2="1155" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1218" y="1160" font-size="11.5" fill="#1A2733">数据流（虚线=部署）</text>
</svg>